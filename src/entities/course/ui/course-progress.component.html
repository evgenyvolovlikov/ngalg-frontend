<div class="course-progress">
  <h2 class="course-progress__title">Course Progress</h2>

  <div class="course-progress__chart">
    <app-progress-ring [progress]="percentage()" [size]="160" [strokeWidth]="12" />
  </div>

  <div class="course-progress__stats">
    <span class="course-progress__label">Videos Watched</span>
    <span class="course-progress__count"> {{ watched() }} / {{ total() }} </span>
  </div>
</div>
