<section class="landing-steps">
  <div class="landing-steps__container">
    <header class="landing-steps__header">
      <span class="landing-steps__tag">// WORKFLOW</span>
      <h2 class="landing-steps__title">Процесс подготовки</h2>
    </header>

    <div class="landing-steps__timeline">
      @for (step of steps; track step.num) {
      <div class="step-card">
        <div class="step-card__marker">{{ step.num }}</div>

        <div class="step-card__content">
          <h3 class="step-card__title">{{ step.title }}</h3>
          <p class="step-card__description">{{ step.description }}</p>

          <div class="step-card__terminal">
            <code>{{ step.command }}</code>
          </div>
        </div>
      </div>
      }
    </div>
  </div>
</section>
