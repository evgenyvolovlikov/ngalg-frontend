<div class="features-list">
  @if (data().sectionTitle; as title) {
  <h3 class="features-list__title">{{ title }}</h3>
  }

  <ul class="features-list__wrapper">
    @for (item of data().items; track item.title) {
    <li class="features-list__item">
      <strong class="features-list__keyword">{{ item.title }}:</strong>
      <span class="features-list__text"> {{ item.text }}</span>
    </li>
    }
  </ul>
</div>
